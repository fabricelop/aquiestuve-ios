name: Construir AquíEstuve iPhone (manual)
run-name: 'AquíEstuve ${{ inputs.request_id }}'

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Identificador para distinguir esta compilación'
        required: false
        default: 'manual'
        type: string

permissions:
  contents: read

concurrency:
  group: aquiestuve-ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Comprobaciones locales y estructura Xcode
        run: |
          set -euo pipefail
          python3 Tests/check_source.py
          swiftc Source/StayReconciliation.swift Tests/check_episodes.swift -o /tmp/aquiestuve-episode-tests
          /tmp/aquiestuve-episode-tests
          plutil -lint AquiEstuve.xcodeproj/project.pbxproj
          plutil -lint Source/Info.plist LiveWidget/Info.plist
          python3 tools/generate_project.py
          git diff --exit-code -- AquiEstuve.xcodeproj/project.pbxproj
      - name: Compilar app y extensión de Actividad en directo sin firma
        run: |
          set -euo pipefail
          xcodebuild -project AquiEstuve.xcodeproj \
            -scheme AquiEstuve \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Preparar IPA incluyendo la extensión
        run: |
          set -euo pipefail
          test -d build/Build/Products/Release-iphoneos/AquiEstuve.app/PlugIns/AquiEstuveLiveWidget.appex
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AquiEstuve.app Payload/
          zip -q -r AquiEstuve-unsigned.ipa Payload
          unzip -t AquiEstuve-unsigned.ipa >/dev/null
      - name: Guardar IPA durante un día
        uses: actions/upload-artifact@v4
        with:
          name: AquiEstuve-unsigned-IPA
          path: AquiEstuve-unsigned.ipa
          retention-days: 1
          if-no-files-found: error
