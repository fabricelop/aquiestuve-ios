name: Construir AquíEstuve iPhone (manual)
run-name: 'AquíEstuve ${{ inputs.request_id }}'

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Identificador de ejecución para evitar confundir compilaciones'
        required: false
        default: 'manual'
        type: string

permissions:
  contents: read

concurrency:
  group: aquiestuve-ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validar estructura sin gastar compilaciones adicionales
        run: python3 Tests/check_source.py
      - name: Compilar aplicación nativa sin firma
        run: |
          set -euo pipefail
          xcodebuild -project AquiEstuve.xcodeproj \
            -scheme AquiEstuve \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Preparar IPA sin firmar
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AquiEstuve.app Payload/
          zip -q -r AquiEstuve-unsigned.ipa Payload
          test -s AquiEstuve-unsigned.ipa
      - name: Guardar IPA por un día
        uses: actions/upload-artifact@v4
        with:
          name: AquiEstuve-unsigned-IPA
          path: AquiEstuve-unsigned.ipa
          retention-days: 1
          if-no-files-found: error
